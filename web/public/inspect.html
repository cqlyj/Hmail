<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ENS inspector · Hmail</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="wrap topbar">
      <a class="brand" href="/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1f3f8f"/><path d="M7.5 10.5h17v11h-17z" fill="none" stroke="#fbf5ea" stroke-width="2" stroke-linejoin="round"/><path d="m8 11 8 6.2 8-6.2" fill="none" stroke="#fbf5ea" stroke-width="2" stroke-linejoin="round"/><circle cx="24.5" cy="23.5" r="5" fill="#d6452f" stroke="#1f3f8f" stroke-width="1.5"/></svg>
        Hmail
      </a>
      <nav><a href="/">Home</a></nav>
    </header>
    <main class="wrap">
      <h1>Look up a house</h1>
      <p class="muted">Every Hmail house has a name on ENS (Sepolia, ENS v2). Enter one to read its live records and what it offers to assistants.</p>
      <form id="lookup" class="card stack">
        <label for="name" class="sr-only">House name</label>
        <div class="field">
          <input id="name" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="url" placeholder="lyj" />
          <span class="suffix">.hmail.eth</span>
        </div>
        <button class="btn primary" type="submit">Look up</button>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <script src="/common.js"></script>
    <script src="/inspect.js"></script>
  </body>
</html>
