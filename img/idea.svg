<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="'Zen Maru Gothic', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="wave" width="48" height="24" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#1f3f8f" stroke-opacity=".09" stroke-width="1.2">
        <circle cx="24" cy="24" r="22"/><circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="10"/>
        <circle cx="0" cy="12" r="22"/><circle cx="0" cy="12" r="16"/><circle cx="48" cy="12" r="22"/><circle cx="48" cy="12" r="16"/>
      </g>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d6452f"/>
    </marker>
  </defs>
  <rect width="1200" height="430" fill="#fbf5ea"/>
  <rect y="370" width="1200" height="60" fill="url(#wave)"/>

  <!-- Panel 1: the inbox -->
  <g transform="translate(40,40)">
    <rect width="340" height="290" rx="22" fill="#fffdf8" stroke="#e6dac3" stroke-width="1.5"/>
    <circle cx="44" cy="44" r="18" fill="#1f3f8f"/><text x="44" y="50" text-anchor="middle" font-size="16" font-weight="900" fill="#fffdf8">1</text>
    <text x="72" y="51" font-size="19" font-weight="900" fill="#15234d">Your assistant reads</text>
    <rect x="24" y="84" width="292" height="118" rx="14" fill="#f4ecdc"/>
    <text x="40" y="112" font-size="13" fill="#5d6789">ETHGlobal · hello@ethglobal.com</text>
    <text x="40" y="140" font-size="16" fill="#15234d">Your login code is</text>
    <rect x="40" y="154" width="258" height="30" rx="8" fill="#e7ecf7"/>
    <text x="169" y="174" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f3f8f">[held · ethglobal.com · login code]</text>
    <text x="24" y="238" font-size="16" fill="#15234d">It can read your mail.</text>
    <text x="24" y="262" font-size="16" font-weight="900" fill="#1f3f8f">Codes stay locked.</text>
  </g>

  <!-- Panel 2: the phone -->
  <g transform="translate(430,40)">
    <rect width="340" height="290" rx="22" fill="#fffdf8" stroke="#d6452f" stroke-width="2"/>
    <circle cx="44" cy="44" r="18" fill="#d6452f"/><text x="44" y="50" text-anchor="middle" font-size="16" font-weight="900" fill="#fffdf8">2</text>
    <text x="72" y="51" font-size="19" font-weight="900" fill="#15234d">You approve</text>
    <rect x="110" y="78" width="120" height="136" rx="18" fill="#fbe5df" stroke="#d6452f" stroke-width="1.5"/>
    <circle cx="170" cy="124" r="24" fill="none" stroke="#d6452f" stroke-width="3"/>
    <circle cx="162" cy="119" r="2.5" fill="#d6452f"/><circle cx="178" cy="119" r="2.5" fill="#d6452f"/>
    <path d="M160 132 Q170 140 180 132" fill="none" stroke="#d6452f" stroke-width="2.5" stroke-linecap="round"/>
    <text x="170" y="172" text-anchor="middle" font-size="13" font-weight="900" fill="#15234d">ethglobal.com</text>
    <rect x="128" y="182" width="84" height="22" rx="11" fill="#d6452f"/>
    <text x="170" y="197" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fffdf8">Approve</text>
    <text x="24" y="238" font-size="16" fill="#15234d">A live face check,</text>
    <text x="24" y="262" font-size="16" font-weight="900" fill="#d6452f">this site, this one time.</text>
  </g>

  <!-- Panel 3: the site -->
  <g transform="translate(820,40)">
    <rect width="340" height="290" rx="22" fill="#fffdf8" stroke="#1f3f8f" stroke-width="2"/>
    <circle cx="44" cy="44" r="18" fill="#1f3f8f"/><text x="44" y="50" text-anchor="middle" font-size="16" font-weight="900" fill="#fffdf8">3</text>
    <text x="72" y="51" font-size="19" font-weight="900" fill="#15234d">It's typed in</text>
    <rect x="24" y="84" width="292" height="118" rx="14" fill="#f4ecdc"/>
    <rect x="24" y="84" width="292" height="28" rx="14" fill="#e6dac3"/>
    <circle cx="44" cy="98" r="4.5" fill="#d6452f"/><circle cx="58" cy="98" r="4.5" fill="#c49a3c"/><circle cx="72" cy="98" r="4.5" fill="#2f7a4f"/>
    <text x="92" y="103" font-size="12.5" fill="#5d6789">https://ethglobal.com</text>
    <rect x="44" y="130" width="252" height="34" rx="8" fill="#fffdf8" stroke="#e6dac3"/>
    <text x="60" y="153" font-size="18" letter-spacing="4" fill="#15234d">••••••</text>
    <circle cx="276" cy="147" r="10" fill="#2f7a4f"/><path d="M271 147 l4 4 l7 -8" fill="none" stroke="#fffdf8" stroke-width="2.4" stroke-linecap="round"/>
    <text x="44" y="186" font-size="12.5" fill="#5d6789">signed in</text>
    <text x="24" y="238" font-size="16" fill="#15234d">Straight into the site.</text>
    <text x="24" y="262" font-size="16" font-weight="900" fill="#1f3f8f">Never in the chat.</text>
  </g>

  <line x1="382" y1="185" x2="426" y2="185" stroke="#d6452f" stroke-width="3" marker-end="url(#a)"/>
  <line x1="772" y1="185" x2="816" y2="185" stroke="#d6452f" stroke-width="3" marker-end="url(#a)"/>

  <rect x="290" y="352" width="620" height="40" rx="20" fill="#fffdf8" stroke="#e6dac3"/>
  <text x="600" y="378" text-anchor="middle" font-size="15" fill="#15234d">The transcript says <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" fill="#1f3f8f">[held · ethglobal.com · login code]</tspan>, not the digits.</text>
</svg>
