<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'Zen Maru Gothic', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="wave" width="48" height="24" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#1f3f8f" stroke-opacity=".09" stroke-width="1.2">
        <circle cx="24" cy="24" r="22"/><circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="10"/>
        <circle cx="0" cy="12" r="22"/><circle cx="0" cy="12" r="16"/><circle cx="48" cy="12" r="22"/><circle cx="48" cy="12" r="16"/>
      </g>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f3f8f"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d6452f"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#fbf5ea"/>
  <rect y="620" width="1200" height="80" fill="url(#wave)"/>

  <text x="40" y="52" font-size="28" font-weight="900" fill="#15234d">How Hmail works</text>
  <text x="40" y="80" font-size="15" fill="#5d6789">Your mail stays on your computer. The code leaves only for one site, one time, after your face check.</text>

  <!-- Assistant -->
  <rect x="40" y="130" width="330" height="250" rx="18" fill="#fffdf8" stroke="#e6dac3" stroke-width="1.5"/>
  <text x="62" y="162" font-size="12" font-weight="700" fill="#5d6789" letter-spacing="1.2">ANY COMPUTER</text>
  <text x="62" y="190" font-size="20" font-weight="900" fill="#15234d">Your AI assistant</text>
  <rect x="62" y="210" width="286" height="62" rx="12" fill="#e7ecf7"/>
  <text x="78" y="236" font-size="15" font-weight="700" fill="#1f3f8f">hmail client</text>
  <text x="78" y="258" font-size="13" fill="#5d6789">signs every call (hors-sdk)</text>
  <rect x="62" y="286" width="286" height="72" rx="12" fill="#e7ecf7"/>
  <text x="78" y="312" font-size="15" font-weight="700" fill="#1f3f8f">typist</text>
  <text x="78" y="333" font-size="13" fill="#5d6789">opens the sealed code in memory,</text>
  <text x="78" y="350" font-size="13" fill="#5d6789">types it into the right Chrome tab</text>

  <!-- House -->
  <rect x="435" y="130" width="330" height="330" rx="18" fill="#fffdf8" stroke="#1f3f8f" stroke-width="2"/>
  <text x="457" y="162" font-size="12" font-weight="700" fill="#5d6789" letter-spacing="1.2">YOUR COMPUTER</text>
  <text x="457" y="190" font-size="20" font-weight="900" fill="#15234d">The house</text>
  <rect x="457" y="210" width="286" height="54" rx="12" fill="#f4ecdc"/>
  <text x="473" y="233" font-size="15" font-weight="700" fill="#15234d">Gmail sync · DKIM · hold</text>
  <text x="473" y="253" font-size="13" fill="#5d6789">codes and sign-in links held back</text>
  <rect x="457" y="274" width="286" height="54" rx="12" fill="#f4ecdc"/>
  <text x="473" y="297" font-size="15" font-weight="700" fill="#15234d">HORS gate</text>
  <text x="473" y="317" font-size="13" fill="#5d6789">only your own human's assistants</text>
  <rect x="457" y="338" width="286" height="54" rx="12" fill="#f4ecdc"/>
  <text x="473" y="361" font-size="15" font-weight="700" fill="#15234d">Sealed vault</text>
  <text x="473" y="381" font-size="13" fill="#5d6789">token, codes, World session at rest</text>
  <rect x="457" y="402" width="286" height="40" rx="12" fill="#f4ecdc"/>
  <text x="473" y="427" font-size="14" font-weight="700" fill="#15234d">Public address via quick tunnel</text>

  <!-- Gmail -->
  <rect x="520" y="96" width="160" height="30" rx="15" fill="#fffdf8" stroke="#e6dac3" stroke-width="1.5"/>
  <text x="600" y="116" font-size="14" font-weight="700" fill="#15234d" text-anchor="middle">Gmail (read-only)</text>

  <!-- Phone -->
  <rect x="830" y="130" width="330" height="250" rx="18" fill="#fffdf8" stroke="#e6dac3" stroke-width="1.5"/>
  <text x="852" y="162" font-size="12" font-weight="700" fill="#5d6789" letter-spacing="1.2">YOUR PHONE</text>
  <text x="852" y="190" font-size="20" font-weight="900" fill="#15234d">You, in World App</text>
  <rect x="852" y="210" width="286" height="62" rx="12" fill="#fbe5df"/>
  <text x="868" y="236" font-size="15" font-weight="700" fill="#d6452f">Approval page</text>
  <text x="868" y="258" font-size="13" fill="#5d6789">shows the house name, site, reason</text>
  <rect x="852" y="286" width="286" height="72" rx="12" fill="#fbe5df"/>
  <text x="868" y="312" font-size="15" font-weight="700" fill="#d6452f">Selfie Check</text>
  <text x="868" y="333" font-size="13" fill="#5d6789">a live face, bound to this site,</text>
  <text x="868" y="350" font-size="13" fill="#5d6789">this reason, this one request</text>

  <!-- Arrows between columns -->
  <line x1="370" y1="232" x2="433" y2="232" stroke="#1f3f8f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="402" y="222" font-size="12" font-weight="700" fill="#1f3f8f" text-anchor="middle">1</text>
  <line x1="765" y1="232" x2="828" y2="232" stroke="#d6452f" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="797" y="222" font-size="12" font-weight="700" fill="#d6452f" text-anchor="middle">2</text>
  <line x1="828" y1="330" x2="767" y2="330" stroke="#d6452f" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="797" y="350" font-size="12" font-weight="700" fill="#d6452f" text-anchor="middle">3</text>
  <line x1="433" y1="330" x2="372" y2="330" stroke="#1f3f8f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="402" y="350" font-size="12" font-weight="700" fill="#1f3f8f" text-anchor="middle">4</text>

  <!-- Legend of steps -->
  <g font-size="14" fill="#15234d">
    <circle cx="52" cy="408" r="11" fill="#1f3f8f"/><text x="52" y="413" font-size="12" font-weight="900" fill="#fffdf8" text-anchor="middle">1</text>
    <text x="72" y="413">Assistant asks: use_code(site, reason)</text>
    <circle cx="52" cy="438" r="11" fill="#d6452f"/><text x="52" y="443" font-size="12" font-weight="900" fill="#fffdf8" text-anchor="middle">2</text>
    <text x="72" y="443">House holds a code for that site → link to you</text>
  </g>
  <g font-size="14" fill="#15234d">
    <circle cx="852" cy="408" r="11" fill="#d6452f"/><text x="852" y="413" font-size="12" font-weight="900" fill="#fffdf8" text-anchor="middle">3</text>
    <text x="872" y="413">Your proof → house verifies it</text>
    <circle cx="852" cy="438" r="11" fill="#1f3f8f"/><text x="852" y="443" font-size="12" font-weight="900" fill="#fffdf8" text-anchor="middle">4</text>
    <text x="872" y="443">Code sealed to the assistant's key</text>
  </g>

  <!-- Public services row -->
  <rect x="330" y="638" width="540" height="34" rx="17" fill="#fffdf8" stroke="#e6dac3"/>
  <text x="600" y="660" font-size="14" font-weight="700" fill="#15234d" text-anchor="middle">None of the public pieces ever see your mail or your codes.</text>
  <rect x="40" y="520" width="360" height="92" rx="16" fill="#fffdf8" stroke="#e6dac3" stroke-width="1.5"/>
  <text x="60" y="548" font-size="16" font-weight="900" fill="#15234d">ENS v2 on Sepolia</text>
  <text x="60" y="572" font-size="13" fill="#5d6789">you.hmail.eth → agent-endpoint[mcp]</text>
  <text x="60" y="592" font-size="13" fill="#5d6789">the house rewrites it on every start</text>

  <rect x="420" y="520" width="360" height="92" rx="16" fill="#fffdf8" stroke="#e6dac3" stroke-width="1.5"/>
  <text x="440" y="548" font-size="16" font-weight="900" fill="#15234d">World</text>
  <text x="440" y="572" font-size="13" fill="#5d6789">AgentBook: which human owns a wallet</text>
  <text x="440" y="592" font-size="13" fill="#5d6789">Verify API: checked by the house server-side</text>

  <rect x="800" y="520" width="360" height="92" rx="16" fill="#fffdf8" stroke="#e6dac3" stroke-width="1.5"/>
  <text x="820" y="548" font-size="16" font-weight="900" fill="#15234d">Hmail web</text>
  <text x="820" y="572" font-size="13" fill="#5d6789">setup + approval pages, World RP signer,</text>
  <text x="820" y="592" font-size="13" fill="#5d6789">name issuer (mints you.hmail.eth)</text>

  <!-- links from boxes to public row -->
  <path d="M205 456 V518" stroke="#1f3f8f" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>
  <text x="215" y="480" font-size="12" fill="#1f3f8f">finds the house by name</text>
  <path d="M600 460 V518" stroke="#1f3f8f" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>
  <path d="M995 456 V518" stroke="#1f3f8f" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>
</svg>
