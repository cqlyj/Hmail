<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="'Zen Maru Gothic', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f3f8f"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d6452f"/>
    </marker>
  </defs>
  <rect width="1200" height="330" fill="#fbf5ea"/>
  <text x="40" y="48" font-size="25" font-weight="900" fill="#15234d">What HORS checks, on every call</text>
  <text x="40" y="74" font-size="15" fill="#5d6789">Before any Hmail code runs, and after it answers. Shown for <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5">use_code</tspan>, the call that releases a login code.</text>

  <g font-size="13.5">
    <g transform="translate(40,104)">
      <rect width="172" height="172" rx="16" fill="#fffdf8" stroke="#e6dac3" stroke-width="1.5"/>
      <text x="16" y="30" font-size="11.5" font-weight="700" fill="#5d6789" letter-spacing="1">SIGNED CALL</text>
      <text x="16" y="58" font-size="16" font-weight="900" fill="#15234d">Who is asking</text>
      <text x="16" y="86" fill="#15234d">The assistant's</text>
      <text x="16" y="106" fill="#15234d">wallet signs the</text>
      <text x="16" y="126" fill="#15234d">call. No accounts,</text>
      <text x="16" y="146" fill="#15234d">no API keys.</text>
    </g>
    <g transform="translate(232,104)">
      <rect width="172" height="172" rx="16" fill="#fffdf8" stroke="#1f3f8f" stroke-width="2"/>
      <text x="16" y="30" font-size="11.5" font-weight="700" fill="#1f3f8f" letter-spacing="1">ORIGIN</text>
      <text x="16" y="58" font-size="16" font-weight="900" fill="#15234d">Whose human</text>
      <text x="16" y="86" fill="#15234d">same-human: only</text>
      <text x="16" y="106" fill="#15234d">wallets linked to</text>
      <text x="16" y="126" fill="#15234d">your World ID.</text>
      <text x="16" y="152" font-size="12" fill="#c0392b">✕ a friend's bot</text>
    </g>
    <g transform="translate(424,104)">
      <rect width="172" height="172" rx="16" fill="#fffdf8" stroke="#1f3f8f" stroke-width="2"/>
      <text x="16" y="30" font-size="11.5" font-weight="700" fill="#1f3f8f" letter-spacing="1">RULES</text>
      <text x="16" y="58" font-size="16" font-weight="900" fill="#15234d">Is it allowed</text>
      <text x="16" y="86" fill="#15234d">A code from this</text>
      <text x="16" y="106" fill="#15234d">site is being held?</text>
      <text x="16" y="126" fill="#15234d">Face-checked?</text>
      <text x="16" y="152" font-size="12" fill="#c0392b">✕ evil.com</text>
    </g>
    <g transform="translate(616,104)">
      <rect width="172" height="172" rx="16" fill="#fbe5df" stroke="#d6452f" stroke-width="2"/>
      <text x="16" y="30" font-size="11.5" font-weight="700" fill="#d6452f" letter-spacing="1">CHALLENGE</text>
      <text x="16" y="58" font-size="16" font-weight="900" fill="#15234d">Ask the human</text>
      <text x="16" y="86" fill="#15234d">Not yet approved?</text>
      <text x="16" y="106" fill="#15234d">The answer is a</text>
      <text x="16" y="126" fill="#15234d">World App link.</text>
      <text x="16" y="146" fill="#15234d">Then it retries.</text>
    </g>
    <g transform="translate(808,104)">
      <rect width="172" height="172" rx="16" fill="#fffdf8" stroke="#e6dac3" stroke-width="1.5"/>
      <text x="16" y="30" font-size="11.5" font-weight="700" fill="#5d6789" letter-spacing="1">TOOL</text>
      <text x="16" y="58" font-size="16" font-weight="900" fill="#15234d">Do the thing</text>
      <text x="16" y="86" fill="#15234d">Spend the code</text>
      <text x="16" y="106" fill="#15234d">once, sealed to a</text>
      <text x="16" y="126" fill="#15234d">one-time key.</text>
    </g>
    <g transform="translate(1000,104)">
      <rect width="160" height="172" rx="16" fill="#fffdf8" stroke="#1f3f8f" stroke-width="2"/>
      <text x="16" y="30" font-size="11.5" font-weight="700" fill="#1f3f8f" letter-spacing="1">MIDDLEWARE</text>
      <text x="16" y="58" font-size="16" font-weight="900" fill="#15234d">Check the reply</text>
      <text x="16" y="86" fill="#15234d">Redaction net: no</text>
      <text x="16" y="106" fill="#15234d">held secret leaves</text>
      <text x="16" y="126" fill="#15234d">in any reply.</text>
    </g>
  </g>
  <g stroke-width="2.2">
    <line x1="212" y1="190" x2="230" y2="190" stroke="#1f3f8f" marker-end="url(#a)"/>
    <line x1="404" y1="190" x2="422" y2="190" stroke="#1f3f8f" marker-end="url(#a)"/>
    <line x1="596" y1="190" x2="614" y2="190" stroke="#d6452f" marker-end="url(#r)"/>
    <line x1="788" y1="190" x2="806" y2="190" stroke="#1f3f8f" marker-end="url(#a)"/>
    <line x1="980" y1="190" x2="998" y2="190" stroke="#1f3f8f" marker-end="url(#a)"/>
  </g>
  <text x="600" y="310" text-anchor="middle" font-size="13.5" fill="#5d6789">Every tool publishes its policy: anyone can list what the house offers and who may call it, without signing.</text>
</svg>
